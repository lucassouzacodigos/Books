<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Recuperação de Senha</title>
        <style>
            body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 0;
            }
            .container {
            width: 100%;
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            }
            h2 {
            color: #333333;
            text-align: center;
            }
            p {
            font-size: 16px;
            color: #555555;
            line-height: 1.6;
            }
            .footer {
            text-align: center;
            font-size: 14px;
            color: #999999;
            margin-top: 30px;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h2>Recuperação de Senha</h2>
            <p>Olá,</p>
            <p>Recebemos uma solicitação para recuperar sua senha. Se você não fez essa solicitação, ignore este e-mail.</p>
            <p>Para redefinir sua senha, utilize a senha temporaria abaixo:</p>
            
            <h4>{{newPassword}}</h4>
            
            <p>Obrigado</p>
            
            <div class="footer">
                <p>Se você tiver algum problema, entre em contato com nossa equipe de suporte.</p>
            </div>
        </div>
    </body>
</html>
